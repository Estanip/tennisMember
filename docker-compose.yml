services:
  postgres:
    image: postgres:16-alpine
    container_name: socios-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socios}
      POSTGRES_DB: ${POSTGRES_DB:-socios}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-socios} -d ${POSTGRES_DB:-socios}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
