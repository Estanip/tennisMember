# Railway — service Web (test)
# In the Railway dashboard: set Root Directory to `/` (repo root)
# and point Config File to this path, OR paste the commands manually.
#
# Required variable at BUILD time: NEXT_PUBLIC_API_URL=https://<api-public-url>/api

[build]
builder = "RAILPACK"
# YARN_PRODUCTION=false: NODE_ENV=production en Railway omite devDependencies
# necesarias para el build de Next/TypeScript.
buildCommand = "YARN_PRODUCTION=false yarn install --frozen-lockfile && yarn build:web"

[deploy]
# node directo: `yarn start:web` suma Yarn + with-env + shell residentes. En Railway las
# variables vienen del entorno (with-env solo carga .env locales).
startCommand = "node node_modules/next/dist/bin/next start apps/web"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
