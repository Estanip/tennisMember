# Railway — service API (test)
# In the Railway dashboard: set Root Directory to `/` (repo root)
# and point Config File to this path, OR paste the commands manually.

[build]
builder = "RAILPACK"
# YARN_PRODUCTION=false: NODE_ENV=production en Railway omite devDependencies
# (@types/node, typescript) y rompe `tsc` en el build.
buildCommand = "YARN_PRODUCTION=false yarn install --frozen-lockfile && yarn build:api"

[deploy]
# Migraciones: el schema de Railway usa preDeployCommand (releaseCommand no existe y se ignora).
# startCommand también corre migrate deploy (idempotente) por si el pre-deploy no está cableado.
preDeployCommand = "yarn db:migrate:deploy"
startCommand = "yarn db:migrate:deploy && yarn start:api"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
